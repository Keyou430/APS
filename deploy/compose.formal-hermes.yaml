services:
  hermes:
    image: ${HERMES_EVIDENCE_IMAGE:-agent-platform-hermes-evidence:v2026.7.7.2}
    build:
      context: .
      dockerfile: hermes-evidence/Dockerfile
      args:
        HERMES_BASE_IMAGE: ${HERMES_IMAGE:-hermes-agent:v2026.7.7.2}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:?Set XIAOMI_API_KEY}
      XIAOMI_BASE_URL: ${XIAOMI_BASE_URL:-https://api.xiaomimimo.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-feishu}
      FEISHU_CONNECTION_MODE: ${FEISHU_CONNECTION_MODE:-websocket}
      FEISHU_ALLOWED_USERS: ${FEISHU_ALLOWED_USERS:-}
      FEISHU_ALLOW_ALL_USERS: ${FEISHU_ALLOW_ALL_USERS:-false}
      FEISHU_ALLOW_BOTS: ${FEISHU_ALLOW_BOTS:-none}
      FEISHU_REQUIRE_MENTION: ${FEISHU_REQUIRE_MENTION:-true}
      FEISHU_GROUP_POLICY: ${FEISHU_GROUP_POLICY:-allowlist}
      FEISHU_HOME_CHANNEL: ${FEISHU_HOME_CHANNEL:-}
      FEISHU_HOME_CHANNEL_NAME: ${FEISHU_HOME_CHANNEL_NAME:-星纪年AI工作平台}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
      FEISHU_BOT_USER_ID: ${FEISHU_BOT_USER_ID:-}
      FEISHU_BOT_NAME: ${FEISHU_BOT_NAME:-}
    volumes:
      - hermes_formal_data:/opt/data
      - ./hermes-formal/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-formal/SOUL.md:/opt/data/SOUL.md:ro
    expose:
      - "8642"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8642/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - platform

  hermes-knowledge:
    image: ${HERMES_EVIDENCE_IMAGE:-agent-platform-hermes-evidence:v2026.7.7.2}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8643"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:?Set XIAOMI_API_KEY}
      XIAOMI_BASE_URL: ${XIAOMI_BASE_URL:-https://api.xiaomimimo.com/v1}
    volumes:
      - hermes_formal_knowledge_data:/opt/data
      - ./hermes-formal/config.knowledge.yaml:/opt/data/config.yaml:ro
      - ./hermes-formal/SOUL.md:/opt/data/SOUL.md:ro
    expose:
      - "8643"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8643/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - platform

  api:
    environment:
      HERMES_API_URL: http://hermes:8642
      HERMES_KNOWLEDGE_API_URL: http://hermes-knowledge:8643
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      HERMES_USE_HTTP: "true"
      HERMES_HTTP_TIMEOUT_SECONDS: "120"
      FEISHU_DELIVERY_CONFIGURED: ${PLATFORM_FEISHU_DELIVERY_CONFIGURED:-false}
      FEISHU_READ_CONFIGURED: ${PLATFORM_FEISHU_READ_CONFIGURED:-false}
      FEISHU_APP_ID: ${PLATFORM_FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${PLATFORM_FEISHU_APP_SECRET:-}
      FEISHU_READ_ALLOWED_ORGANIZATION_IDS: ${PLATFORM_FEISHU_READ_ALLOWED_ORGANIZATION_IDS:-}
      FEISHU_READ_ALLOWED_DOCUMENT_TOKENS: ${PLATFORM_FEISHU_READ_ALLOWED_DOCUMENT_TOKENS:-}
      FEISHU_READ_ALLOWED_BASE_TABLES: ${PLATFORM_FEISHU_READ_ALLOWED_BASE_TABLES:-}
      FEISHU_READ_ALLOWED_CHAT_IDS: ${PLATFORM_FEISHU_READ_ALLOWED_CHAT_IDS:-}
      # Formal entry: /docs and /openapi.json stay closed to the public edge;
      # internal debugging re-enables them by setting EXPOSE_DOCS=true.
      EXPOSE_DOCS: "false"
    depends_on:
      hermes:
        condition: service_healthy
      hermes-knowledge:
        condition: service_healthy

  pipeline-worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers.pipeline_worker"]
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in deploy/.env}
      JWT_ALGORITHM: HS256
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      HERMES_API_URL: http://hermes:8642
      HERMES_KNOWLEDGE_API_URL: http://hermes-knowledge:8643
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      HERMES_USE_HTTP: "true"
      HERMES_HTTP_TIMEOUT_SECONDS: "120"
      RAG_QUERY_AUDIT_HMAC_KEY: ${RAG_QUERY_AUDIT_HMAC_KEY:?Set RAG_QUERY_AUDIT_HMAC_KEY in deploy/.env}
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_healthy
      hermes-knowledge:
        condition: service_healthy
    networks:
      - platform

  # Platform-owned outbound notification authority (Phase 1 C1/C2). The
  # Hermes-native Feishu platform above only handles inbound bot sessions and
  # its own tool traffic; decision notifications are sent exclusively through
  # this outbox consumer. Missing FEISHU credentials surface as
  # feishu_not_configured on /api/delivery/status, never as fake success.
  delivery-worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers.delivery_worker"]
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in deploy/.env}
      JWT_ALGORITHM: HS256
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      RAG_QUERY_AUDIT_HMAC_KEY: ${RAG_QUERY_AUDIT_HMAC_KEY:?Set RAG_QUERY_AUDIT_HMAC_KEY in deploy/.env}
      FEISHU_APP_ID: ${PLATFORM_FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${PLATFORM_FEISHU_APP_SECRET:-}
      PLATFORM_PUBLIC_BASE_URL: ${PLATFORM_PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - platform

  web:
    ports:
      # Default binds loopback only: the public entry must sit behind a TLS
      # reverse proxy. Override FORMAL_APP_BIND when that proxy is external.
      - "${FORMAL_APP_BIND:-127.0.0.1}:${FORMAL_APP_PORT:-8092}:80"

volumes:
  hermes_formal_data:
  hermes_formal_knowledge_data:
