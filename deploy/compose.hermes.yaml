services:
  hermes:
    build:
      # prepare-hermes-source.sh materializes this immutable commit into the ignored runtime context.
      context: ./.runtime/hermes-source
      dockerfile: Dockerfile
      args:
        HERMES_GIT_SHA: 9de9c25f620ff7f1ce0fd5457d596052d5159596
    image: ${HERMES_IMAGE:-hermes-agent:v2026.7.7.2}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY or run the Hermes-enabled startup script}
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ALLOWED_USERS: ${DINGTALK_ALLOWED_USERS:-}
      DINGTALK_ALLOWED_CHATS: ${DINGTALK_ALLOWED_CHATS:-}
      DINGTALK_REQUIRE_MENTION: ${DINGTALK_REQUIRE_MENTION:-true}
      DINGTALK_ALLOW_ALL_USERS: ${DINGTALK_ALLOW_ALL_USERS:-false}
      DINGTALK_HOME_CHANNEL: ${DINGTALK_HOME_CHANNEL:-}
      DINGTALK_HOME_CHANNEL_NAME: ${DINGTALK_HOME_CHANNEL_NAME:-星纪年AI工作平台}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_CARD_TEMPLATE_ID: ${DINGTALK_CARD_TEMPLATE_ID:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      DINGTALK_DOC_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_DOC_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_DOC_OPERATOR_ID: ${DINGTALK_DOC_OPERATOR_ID:-}
      DINGTALK_ALLOWED_RESOURCE_HOSTS: ${DINGTALK_ALLOWED_RESOURCE_HOSTS:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-feishu}
      FEISHU_CONNECTION_MODE: ${FEISHU_CONNECTION_MODE:-websocket}
      FEISHU_ALLOWED_USERS: ${FEISHU_ALLOWED_USERS:-}
      FEISHU_ALLOW_ALL_USERS: ${FEISHU_ALLOW_ALL_USERS:-false}
      FEISHU_ALLOW_BOTS: ${FEISHU_ALLOW_BOTS:-none}
      FEISHU_REQUIRE_MENTION: ${FEISHU_REQUIRE_MENTION:-true}
      FEISHU_GROUP_POLICY: ${FEISHU_GROUP_POLICY:-allowlist}
      FEISHU_HOME_CHANNEL: ${FEISHU_HOME_CHANNEL:-}
      FEISHU_HOME_CHANNEL_NAME: ${FEISHU_HOME_CHANNEL_NAME:-星纪年AI工作平台}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
      FEISHU_BOT_USER_ID: ${FEISHU_BOT_USER_ID:-}
      FEISHU_BOT_NAME: ${FEISHU_BOT_NAME:-}
      DOCKER_HOST: ssh://hermes-runner@192.168.3.107
      HERMES_REMOTE_DOCKER_STRICT: "1"
      PYTHONPATH: /opt/platform-policy
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in deploy/.env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
    volumes:
      - hermes_data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/skills/hr-weekly-report:/opt/data/skills/hr-weekly-report:ro
      - ./hermes/plugins/dingtalk_documents:/opt/data/plugins/dingtalk_documents:ro
      - ./hermes/platform_policy:/opt/platform-policy:ro
      - ./.runtime/hermes-runner-ssh:/opt/data/.ssh:ro
    expose:
      - "8642"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8642/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - platform

  api:
    environment:
      HERMES_API_URL: http://hermes:8642
      HERMES_KNOWLEDGE_API_URL: http://hermes-knowledge:8643
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY or run the Hermes-enabled startup script}
      HERMES_USE_HTTP: "true"
      HERMES_HTTP_TIMEOUT_SECONDS: "120"
      SANDBOX_RUNNER_ENABLED: "true"
      SANDBOX_MAX_ACTIVE_RUNS_GLOBAL: "8"
      SANDBOX_MAX_ACTIVE_RUNS_PER_ORGANIZATION: "4"
      SANDBOX_MAX_ACTIVE_RUNS_PER_USER: "2"
      SANDBOX_RUNNER_URL: https://192.168.3.107:9443
      SANDBOX_RUNNER_CA_CERTIFICATE: /run/hermes-runner-control/ca.crt
      SANDBOX_RUNNER_CLIENT_CERTIFICATE: /run/hermes-runner-control/client.crt
      SANDBOX_RUNNER_CLIENT_PRIVATE_KEY: /run/hermes-runner-control/client.key
      SANDBOX_ATTESTATION_FILE: /run/hermes-sandbox/attestation.json
    volumes:
      - ./.runtime/hermes-runner-control:/run/hermes-runner-control:ro
      - ./.runtime/sandbox-attestation.json:/run/hermes-sandbox/attestation.json:ro
    command:
      - /bin/sh
      - -ec
      - >-
        test -r "$${SANDBOX_ATTESTATION_FILE}" &&
        python scripts/validate_sandbox_attestation.py < "$${SANDBOX_ATTESTATION_FILE}" &&
        alembic upgrade head && python seed.py &&
        exec uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      hermes:
        condition: service_healthy
      hermes-knowledge:
        condition: service_healthy

  pipeline-worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers.pipeline_worker"]
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in deploy/.env}
      JWT_ALGORITHM: HS256
      HERMES_API_URL: http://hermes:8642
      HERMES_KNOWLEDGE_API_URL: http://hermes-knowledge:8643
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY}
      HERMES_USE_HTTP: "true"
      HERMES_HTTP_TIMEOUT_SECONDS: "120"
      RAG_QUERY_AUDIT_HMAC_KEY: ${RAG_QUERY_AUDIT_HMAC_KEY:?Set RAG_QUERY_AUDIT_HMAC_KEY in deploy/.env}
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      hermes:
        condition: service_healthy
      hermes-knowledge:
        condition: service_healthy
    networks:
      - platform

  pipeline-approval-worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers.pipeline_approval_worker"]
    environment:
      APP_ENV: container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agent_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in deploy/.env}
      JWT_ALGORITHM: HS256
      RAG_QUERY_AUDIT_HMAC_KEY: ${RAG_QUERY_AUDIT_HMAC_KEY:?Set RAG_QUERY_AUDIT_HMAC_KEY in deploy/.env}
      PIPELINE_APPROVAL_WORKER_POLL_SECONDS: ${PIPELINE_APPROVAL_WORKER_POLL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - platform

  hermes-knowledge:
    build:
      context: ./.runtime/hermes-source
      dockerfile: Dockerfile
      args:
        HERMES_GIT_SHA: 9de9c25f620ff7f1ce0fd5457d596052d5159596
    image: ${HERMES_IMAGE:-hermes-agent:v2026.7.7.2}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8643"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY or run the Hermes-enabled startup script}
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      PYTHONPATH: /opt/platform-policy
      DINGTALK_DOC_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_DOC_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_DOC_OPERATOR_ID: ${DINGTALK_DOC_OPERATOR_ID:-}
      DINGTALK_ALLOWED_RESOURCE_HOSTS: ${DINGTALK_ALLOWED_RESOURCE_HOSTS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in deploy/.env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    volumes:
      - hermes_knowledge_data:/opt/data
      - ./hermes/config.knowledge.yaml:/opt/data/config.yaml:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/plugins/dingtalk_documents:/opt/data/plugins/dingtalk_documents:ro
    expose:
      - "8643"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8643/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - platform

volumes:
  hermes_data:
  hermes_knowledge_data:
