[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-mcp"
version = "0.1.0"
description = "MCP Server for Hermes Agent — unified message/API/retrieval hub"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes MCP Team" }]
keywords = ["mcp", "hermes", "fastmcp", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "respx>=0.22",
]

[project.scripts]
hermes-mcp = "hermes_mcp.__main__:main"
hermes-feishu-readonly = "hermes_mcp.feishu_readonly:main"
hermes-lark-cli = "hermes_mcp.lark_cli_full:main"

[project.entry-points."hermes_agent.plugins"]
hermes-mcp = "hermes_mcp.plugin"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
